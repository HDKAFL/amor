name: Deploy static site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - assets/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [ "$build_type" = "workflow" ]; then
            echo "actions_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "actions_source=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is still configured to deploy from a branch."
          fi

      - name: Check out repository
        if: steps.pages.outputs.actions_source == 'true'
        uses: actions/checkout@v4

      - name: Upload site artifact
        if: steps.pages.outputs.actions_source == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            assets/

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.actions_source == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
